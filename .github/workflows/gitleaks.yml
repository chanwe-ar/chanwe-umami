name: Gitleaks

# Chanwe fork: upstream runs gitleaks-action on Blacksmith runners, which this
# org does not have (runs queued forever), and the action needs a paid licence
# for organisation repos. This runs the gitleaks CLI on GitHub's runners.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: Scan for secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.28.0 \
            git /repo --redact --no-banner --log-opts="${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || '-n 50' }}"
